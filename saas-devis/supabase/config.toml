# Configuration Supabase CLI (extrait) — `supabase link` complète le reste
[functions.send-document]
verify_jwt = true

[functions.generate-quote]
verify_jwt = true

# API publique du widget : pas de JWT, la clé publique du widget identifie l'entreprise
[functions.widget-chat]
verify_jwt = false

[functions.billing]
verify_jwt = true

# Appelé par Stripe : authentifié par la signature du webhook
[functions.stripe-webhook]
verify_jwt = false

# Appelée par pg_cron (en-tête x-cron-secret) ou par l'application (JWT vérifié dans la fonction)
[functions.send-reminders]
verify_jwt = false

[functions.connect]
verify_jwt = true

# Page publique du devis (jeton) : pas de session
[functions.deposit-checkout]
verify_jwt = false
